<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VLC YouTube Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- VLC cone shape -->
        <path d="M12 2L4 20h16L12 2z" fill="#FF8800"/>
        <path d="M8.5 13h7l0.8 2H7.7L8.5 13z" fill="white" opacity="0.9"/>
        <path d="M10 9h4l0.5 1.5H9.5L10 9z" fill="white" opacity="0.7"/>
        <rect x="5" y="20" width="14" height="2" rx="1" fill="#FF8800"/>
      </svg>
      <span class="header-title">VLC Launcher</span>
    </div>
    <div class="header-badge">YouTube</div>
  </header>

  <!-- Main Content -->
  <main class="main" id="main-content">

    <!-- Loading State -->
    <div class="state" id="state-loading">
      <div class="spinner" role="status" aria-label="Loading video info"></div>
      <p class="state-text">Reading video info…</p>
    </div>

    <!-- Not YouTube State -->
    <div class="state hidden" id="state-not-youtube">
      <div class="state-icon-wrap state-icon-warn" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <p class="state-text">Navigate to a<br/><strong>YouTube video</strong> first.</p>
    </div>

    <!-- Error State -->
    <div class="state hidden" id="state-error">
      <div class="state-icon-wrap state-icon-error" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
      <p class="state-text" id="error-message">Something went wrong.</p>
    </div>

    <!-- Ready State -->
    <div class="state hidden" id="state-ready">
      <!-- Video Info Card -->
      <div class="video-card" aria-label="Current YouTube video">
        <div class="video-thumb-wrap">
          <img class="video-thumb" id="video-thumb" src="" alt="Video thumbnail" />
          <div class="video-thumb-overlay" aria-hidden="true"></div>
          <div class="timestamp-badge" id="timestamp-badge" aria-label="Current timestamp">0:00</div>
        </div>
        <div class="video-meta">
          <p class="video-title" id="video-title" title="">Loading…</p>
          <p class="video-channel" id="video-channel">—</p>
        </div>
      </div>

      <!-- Action Button -->
      <button class="btn-vlc" id="btn-open-vlc" type="button" aria-label="Open this video in VLC Media Player">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 20h16L12 2z" fill="#FF8800"/>
            <path d="M8.5 13h7l0.8 2H7.7L8.5 13z" fill="white" opacity="0.9"/>
            <path d="M10 9h4l0.5 1.5H9.5L10 9z" fill="white" opacity="0.7"/>
            <rect x="5" y="20" width="14" height="2" rx="1" fill="#FF8800"/>
          </svg>
        </span>
        <span class="btn-label">Open in VLC</span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </span>
      </button>



      <!-- Timestamp toggle -->
      <label class="timestamp-toggle" for="use-timestamp">
        <input class="toggle-input" type="checkbox" id="use-timestamp" checked />
        <span class="toggle-track" aria-hidden="true">
          <span class="toggle-thumb"></span>
        </span>
        <span class="toggle-label">Start at current timestamp</span>
      </label>

      <!-- Success flash -->
      <div class="success-flash hidden" id="success-flash" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Launching VLC…
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <span>VLC YouTube Launcher</span>
    <span class="footer-sep">·</span>
    <span>v1.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
